name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write # delete this run's intermediate build artifacts after publishing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check package.json version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE" != "$VERSION" ]; then
            echo "::warning::package.json version $PACKAGE does not match tag $GITHUB_REF_NAME"
          fi

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set crate version from tag
        run: sed -i.bak "s/^version = \".*\"/version = \"${GITHUB_REF_NAME#v}\"/" cli/Cargo.toml && rm cli/Cargo.toml.bak
      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test
        # Cross-compiled macOS x86_64 binaries still run on Apple silicon via Rosetta.
        working-directory: cli
        run: cargo test --release --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME="song2html-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          BIN=song2html
          [ "${{ runner.os }}" = "Windows" ] && BIN=song2html.exe
          cp "cli/target/${{ matrix.target }}/release/$BIN" README.md SPEC.md "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: song2html-${{ matrix.target }}
          path: dist/*.*z*
          if-no-files-found: error
          # Only needed until the release job attaches them; expire quickly if it fails.
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Delete intermediate build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[].id' |
            xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
