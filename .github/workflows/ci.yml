name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          # PRs restore main's cache but never save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - working-directory: cli
        run: cargo test
      - working-directory: cli
        run: cargo build
      - name: Native and Node CLIs agree
        env:
          S2H_NATIVE_BIN: cli/target/debug/song2html
        run: node --test test/cli.test.js
