name: song2html
version: 2026.9.14
description: >-
  Parse, validate, import, convert, transpose, and render song chord
  charts through the canonical Song AST.
author: Fingerskier
manifest_version: 1
homepage: https://github.com/fingerskier/song2html
license: MIT
tags:
  - song
  - chord
  - lyrics
  - html
  - nashville-number
  - mcp
config_schema:
  library_root:
    type: str
    description: >-
      Optional absolute directory that confines read, write, and list
      operations. Environment SONG2HTML_LIBRARY_ROOT overrides this setting.
provides_tools:
  - parse_song
  - validate_song
  - create_song
  - read_song_file
  - write_song_file
  - list_song_files
  - transpose_song
  - detect_format
  - import_song
  - preview_song
  - render_html
provides_commands:
  - convert-chord-chart
provides_skills:
  - song2html
  - convert-chord-chart
